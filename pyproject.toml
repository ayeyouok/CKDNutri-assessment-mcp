[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "CKDNutri-assessment-mcp"
version = "0.3.73"
description = "P4 评估计算域——eGFR+CKD分期+风险引擎（纯函数）"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "pydantic>=2",
    "a207-policy>=0.3.56",
]

[project.scripts]
CKDNutri-assessment-mcp = "CKDNutri_assessment_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
CKDNutri_assessment_mcp = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # 行超长不阻断（存量历史注释多），仅提示

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # 测试：sys.path/env 设置在 import 前（既有标准模式）
